server:
  port: 19080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # 演示环境允许本机前端开发端口；生产环境必须收敛为显式来源
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: data-service
          uri: lb://data-service
          predicates:
            - Path=/api/data/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**

# 与 auth-service 保持一致；生产环境必须外部化（环境变量/配置中心）
jwt:
  secret: ${JWT_SECRET:zhihui-demo-jwt-secret-key-change-me-in-production-0123456789abcdef}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
