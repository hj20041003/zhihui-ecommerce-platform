server:
  port: 8101

spring:
  application:
    name: data-service
  datasource:
    # 生产环境请改用环境变量注入：${DB_URL} / ${DB_USERNAME} / ${DB_PASSWORD}
    url: jdbc:mysql://localhost:3306/zhihui_mall?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: "1234"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.zhihui.data: INFO
    org.hibernate.SQL: WARN
